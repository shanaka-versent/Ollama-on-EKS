# Monitoring namespace — air-gapped with CloudWatch exception for Grafana FinOps
# Prometheus + Alertmanager: no internet egress
# Grafana: HTTPS egress to AWS APIs only (CloudWatch for FinOps dashboard)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-airgap
  namespace: monitoring
spec:
  podSelector:
    matchExpressions:
      # All pods EXCEPT Grafana
      - key: app.kubernetes.io/name
        operator: NotIn
        values: ["grafana"]
  policyTypes:
    - Egress
  egress:
    # Scrape targets in any namespace (Prometheus needs this)
    - to:
        - namespaceSelector: {}
    # DNS
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # NO egress to 0.0.0.0/0 — air-gapped
---
# Grafana: allow CloudWatch API access (for FinOps showback dashboard)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-cloudwatch
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Egress
  egress:
    # Intra-cluster (query Prometheus, Alertmanager)
    - to:
        - namespaceSelector: {}
    # DNS
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # HTTPS to AWS APIs (CloudWatch, CloudWatch Logs, STS for IRSA)
    - to: []
      ports:
        - port: 443
          protocol: TCP
