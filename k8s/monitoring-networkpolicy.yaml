# Monitoring namespace — air-gapped
# @author Shanaka Jayasundera - shanakaj@gmail.com
#
# No in-cluster Grafana — all dashboards in AWS Managed Grafana (AMG).
# AMG reads from AMP (Prometheus metrics) and CloudWatch natively via IAM role.
# Prometheus needs HTTPS egress to AMP for remote write (SigV4 auth via IRSA).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-airgap
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow intra-namespace (Prometheus scraping Alertmanager, etc.)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
  egress:
    # Scrape targets in any namespace (Prometheus needs this)
    - to:
        - namespaceSelector: {}
    # DNS
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # HTTPS to AWS APIs (AMP remote write via SigV4 + STS for IRSA token exchange)
    - to: []
      ports:
        - port: 443
          protocol: TCP
