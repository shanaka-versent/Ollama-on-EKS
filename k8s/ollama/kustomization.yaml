# Base kustomization for Ollama
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - gpu-controller-rbac.yaml
  # storageclass.yaml and volume-snapshot.yaml are managed by ollama-storage ArgoCD app (wave 2)
