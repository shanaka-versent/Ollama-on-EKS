# Ollama Deployment
# Runs the Ollama LLM server on a g5.12xlarge GPU node (4x NVIDIA A10G, 96GB VRAM).
# The pod is scheduled exclusively on GPU nodes via nodeSelector + toleration.
# Model data is stored on a 200Gi EBS gp3 PVC that persists across restarts.
#
# To change the instance type or GPU count:
#   1. Update resources.limits/requests below
#   2. Update the OLLAMA_* env vars if needed
#   3. Commit and push — ArgoCD self-heals automatically
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
    app.kubernetes.io/part-of: ollama-private-llm
spec:
  replicas: 1
  # Recreate (not RollingUpdate) because GPU nodes have exclusive GPU allocation.
  # RollingUpdate would leave new pod Pending forever (old pod holds all GPUs).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      # Schedule on GPU nodes only (matches gpu-ollama NodePool template label)
      # EKS Auto Mode doesn't recognize nvidia.com/gpu.present — use our custom label
      nodeSelector:
        workload-type: gpu-inference
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ollama
          image: ollama/ollama:0.18.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_KEEP_ALIVE
              value: "24h"
            - name: OLLAMA_NUM_PARALLEL
              value: "4"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            # Context window — 32K tokens. num_parallel × context determines KV cache size.
            # qwen3.5:122b-a10b (MoE, 10B active) fits comfortably on 4x A10G with 32K context.
            - name: OLLAMA_CONTEXT_LENGTH
              value: "32768"
          resources:
            # DEV: g5.xlarge (1x A10G, 4 vCPU, ~15Gi allocatable)
            # PROD: nvidia.com/gpu: "4", memory: "96Gi"/"64Gi", cpu: "16"/"8"
            limits:
              nvidia.com/gpu: "1"
              memory: "14Gi"
              cpu: "3"
            requests:
              nvidia.com/gpu: "1"
              memory: "12Gi"
              cpu: "2"
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-models-pvc
