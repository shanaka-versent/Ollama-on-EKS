# Ollama Deployment
# Runs the Ollama LLM server on GPU nodes (NVIDIA A10G).
# The pod is scheduled exclusively on GPU nodes via nodeSelector + toleration.
# Model data is loaded from an EBS snapshot via ephemeral volume — enables
# multi-AZ GPU provisioning (volume created in whichever AZ the node lands).
#
# Resource limits (GPU count, memory, CPU) are set per environment via
# Kustomize overlays in k8s/overlays/dev/ and k8s/overlays/prod/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
    app.kubernetes.io/part-of: ollama-private-llm
spec:
  replicas: 1
  # Recreate (not RollingUpdate) because GPU nodes have exclusive GPU allocation.
  # RollingUpdate would leave new pod Pending forever (old pod holds all GPUs).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      # Schedule on GPU nodes only (matches gpu-ollama NodePool template label)
      # EKS Auto Mode doesn't recognize nvidia.com/gpu.present — use our custom label
      nodeSelector:
        workload-type: gpu-inference
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # Security: run all containers as non-root (CIS Benchmark 5.2.6)
      # fsGroup ensures the ephemeral volume is writable by UID 1000
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Fix volume ownership before main container starts.
      # EBS snapshot was created as root; initContainer runs once to chown.
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /data/models"]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: ollama-data
              mountPath: /data/models
      containers:
        - name: ollama
          image: ollama/ollama:0.18.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            # Log level for audit trail — inference requests logged to stdout
            # (shipped to CloudWatch via Fluent Bit / Container Insights)
            - name: OLLAMA_LOG_LEVEL
              value: "INFO"
            # Redirect model storage from /root/.ollama to /data/models
            # so the container doesn't need write access to /root
            - name: OLLAMA_MODELS
              value: "/data/models"
            - name: OLLAMA_KEEP_ALIVE
              value: "24h"
            - name: OLLAMA_NUM_PARALLEL
              value: "4"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            # Context window — 32K tokens. num_parallel × context determines KV cache size.
            # qwen3.5:122b-a10b (MoE, 10B active) fits comfortably on 4x A10G with 32K context.
            - name: OLLAMA_CONTEXT_LENGTH
              value: "32768"
            # HOME must be writable for Ollama's config files
            - name: HOME
              value: "/tmp/ollama-home"
          resources:
            # Set per environment via Kustomize overlay
            limits:
              nvidia.com/gpu: "1"
              memory: "14Gi"
              cpu: "3"
            requests:
              nvidia.com/gpu: "1"
              memory: "12Gi"
              cpu: "1"
          volumeMounts:
            - name: ollama-data
              mountPath: /data/models
            - name: tmp-home
              mountPath: /tmp/ollama-home
          # Startup probe: suppresses liveness + readiness until model is loaded.
          # Model loading from EBS snapshot takes 2-4 minutes. Without this,
          # liveness kills the pod at ~120s → infinite CrashLoopBackOff.
          # Grace period: 30 + (15 × 20) = 330s = 5.5 min.
          startupProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        # Writable home dir for Ollama config (emptyDir, pod-scoped)
        - name: tmp-home
          emptyDir: {}
        # Ephemeral volume from EBS snapshot — created in the pod's AZ,
        # deleted when pod terminates. Models are preserved in the snapshot.
        # This enables multi-AZ GPU provisioning for better spot availability.
        - name: ollama-data
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                storageClassName: gp3-ephemeral
                resources:
                  requests:
                    storage: 200Gi
                dataSource:
                  name: ollama-models-snapshot
                  kind: VolumeSnapshot
                  apiGroup: snapshot.storage.k8s.io
