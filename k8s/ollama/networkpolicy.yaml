# Ollama NetworkPolicy — Air-Gap Enforced
# @author Shanaka Jayasundera - shanakaj@gmail.com
#
# This policy enforces the air-gap principle:
#   - Ingress: only from istio-system namespace on port 11434
#   - Egress: DNS (port 53) + intra-cluster only — NO internet access
#
# Verify air-gap: kubectl exec -n ollama deploy/ollama -- curl -s --max-time 5 https://google.com
# Expected: connection timeout (exit code 28)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-airgap
  namespace: ollama
  labels:
    app: ollama
    app.kubernetes.io/part-of: ollama-private-llm
spec:
  podSelector:
    matchLabels:
      app: ollama
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Istio (ztunnel in istio-system + gateway in istio-ingress)
    # and Open WebUI (calls ollama.ollama.svc:11434 for model listing + inference)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: open-webui
      ports:
        - port: 11434
          protocol: TCP
  egress:
    # DNS resolution only — Ollama is a server (receives requests,
    # never initiates outbound). Broad intra-cluster egress removed
    # to limit lateral movement if container is compromised.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
