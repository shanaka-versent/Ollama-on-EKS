# Ollama on EKS - HTTPRoutes for Kubernetes Gateway API
# @author Shanaka Jayasundera - shanakaj@gmail.com
#
# Routes traffic from the Istio Gateway to backend services.
# API Gateway traffic (VPC Link) → /v1/*, /api/* → Ollama
# CloudFront traffic (NLB direct) → /* → Open WebUI (via k8s/open-webui/httproute.yaml)

---
# Ollama Route — handles Ollama API paths
# Only Ollama-native endpoints; Open WebUI has its own /api/* paths
# API Gateway traffic arrives via VPC Link → NLB → these routes
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama-route
  namespace: ollama
spec:
  parentRefs:
    - name: ollama-gateway
      namespace: istio-ingress
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/
      backendRefs:
        - name: ollama
          port: 11434
    # Ollama-native API endpoints (distinct from Open WebUI /api/*)
    - matches:
        - path:
            type: Exact
            value: /api/tags
        - path:
            type: Exact
            value: /api/generate
        - path:
            type: Exact
            value: /api/chat
        - path:
            type: Exact
            value: /api/show
        - path:
            type: Exact
            value: /api/ps
      backendRefs:
        - name: ollama
          port: 11434

---
# Health Route — handles /healthz for Kong Cloud Gateway health checks
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: health-route
  namespace: ollama
spec:
  parentRefs:
    - name: ollama-gateway
      namespace: istio-ingress
  rules:
    - matches:
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: ollama
          port: 11434

---
# ReferenceGrant — allow HTTPRoutes in 'ollama' namespace to reference
# services and attach to the Gateway in 'istio-ingress' namespace
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-ollama-routes
  namespace: ollama
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: ollama
  to:
    - group: ""
      kind: Service
