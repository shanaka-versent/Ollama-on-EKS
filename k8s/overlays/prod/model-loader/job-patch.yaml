# PROD patch for Model Loader
# Loads the flagship model instead of the fallback
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-model-loader
  namespace: ollama
spec:
  template:
    spec:
      containers:
        - name: model-loader
          env:
            - name: OLLAMA_MODEL
              value: "qwen3.5:122b-a10b"
            - name: OLLAMA_URL
              value: "http://ollama.ollama.svc.cluster.local:11434"
