# PROD patch for Ollama deployment
# g5.12xlarge: 4x A10G (96GB VRAM), 48 vCPU, 192Gi RAM
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
spec:
  template:
    spec:
      containers:
        - name: ollama
          resources:
            limits:
              nvidia.com/gpu: "4"
              memory: "96Gi"
              cpu: "16"
            requests:
              nvidia.com/gpu: "4"
              memory: "64Gi"
              cpu: "8"
