# PROD patch for Open WebUI deployment
# Sets default model to flagship (qwen3.5:122b-a10b)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  template:
    spec:
      containers:
        - name: open-webui
          env:
            # Override default model to flagship
            - name: DEFAULT_MODELS
              value: "qwen3.5:122b-a10b"
            - name: MODEL_FILTER_LIST
              value: "qwen3.5:122b-a10b"
