# KEDA ScaledObject — Auto-scale Ollama to zero when idle
# @author Shanaka Jayasundera - shanakaj@gmail.com
#
# Monitors Ollama container CPU usage via Prometheus. During inference,
# CPU is 1-4 cores. When idle (model loaded, no requests), CPU drops
# to ~0.01-0.05 cores.
#
# Timing (kubelet scrapes every 30s, rate window 5m):
#   - rate() has data within ~60s of pod start (2 scrapes)
#   - After idle: ~5 min for rate to reflect idle + 30 min cooldown = ~35 min to scale-to-zero
#
# IMPORTANT: Scale-from-zero MUST use ./scripts/scale-up.sh (pauses KEDA first).
# Direct kubectl scale will fail — KEDA kills the pod before rate() has data.
# scale-up.sh pauses KEDA, and the safety check unpauses after the grace
# period when metrics are available.
#
# To pause auto-scaling (e.g., during maintenance):
#   kubectl annotate scaledobject ollama-autoscaler -n ollama \
#     autoscaling.keda.sh/paused="true" --overwrite
# To resume:
#   kubectl annotate scaledobject ollama-autoscaler -n ollama \
#     autoscaling.keda.sh/paused- --overwrite
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ollama-autoscaler
  namespace: ollama
spec:
  scaleTargetRef:
    name: ollama
  minReplicaCount: 0
  maxReplicaCount: 1
  # 45 minutes — wait after last active signal before scaling to 0
  cooldownPeriod: 2700
  # 45 minutes — on first deploy, allow time for model loading before auto-scaling kicks in
  initialCooldownPeriod: 2700
  pollingInterval: 60
  advanced:
    restoreToOriginalReplicaCount: false
  # Safety net: if Prometheus is unreachable or returns errors for 5 consecutive
  # polls (5 × 60s = 5 min), keep 1 replica instead of scaling to 0.
  fallback:
    failureThreshold: 5
    replicas: 1
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
        metricName: ollama_cpu_activity
        # CPU usage rate over 5-min window (kubelet scrapes every 30s,
        # giving 10+ data points per window for accurate rate calculation).
        # Inference: 1.0-4.0 cores (well above threshold)
        # Idle:      0.01-0.05 cores (below threshold)
        query: sum(rate(container_cpu_usage_seconds_total{namespace="ollama",pod=~"ollama.*",container="ollama"}[5m]))
        threshold: "0.1"
        activationThreshold: "0.05"
