# Open WebUI — Browser-Based Chat Interface (Model Locked)
# @author Shanaka Jayasundera - shanakaj@gmail.com
#
# Provides a ChatGPT-like web interface for Ollama.
# Model switching is restricted to admin users only — regular users see
# only the default model (flagship). Admins can switch via the UI or CLI.
# Runs on system nodes (no GPU needed). Connects to Ollama via ClusterIP.
#
# Access: via CloudFront URL (Cognito login with MFA)
# Auth: Cognito User Pool (OAuth/OIDC) — all user management in Cognito Console
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app: open-webui
    app.kubernetes.io/part-of: ollama-private-llm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      # Run on system nodes (no GPU needed)
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.8.10
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            # Connect to Ollama via ClusterIP service
            - name: OLLAMA_BASE_URL
              value: "http://ollama.ollama.svc.cluster.local:11434"
            # Disable external connections (air-gap compliant)
            - name: ENABLE_RAG_WEB_SEARCH
              value: "false"
            - name: ENABLE_IMAGE_GENERATION
              value: "false"
            # Disable telemetry
            - name: SCARF_NO_ANALYTICS
              value: "true"
            - name: DO_NOT_TRACK
              value: "true"
            # Default model — locked for regular users
            - name: DEFAULT_MODELS
              value: "qwen3.5:122b-a10b"
            # Model filtering — only show the default model to users
            # Admins (first user + promoted users) can see all models
            - name: MODEL_FILTER_ENABLED
              value: "true"
            - name: MODEL_FILTER_LIST
              value: "qwen3.5:122b-a10b"
            # --- Cognito OAuth/OIDC Authentication ---
            # Disable local login/signup — all auth via Cognito
            - name: ENABLE_SIGNUP
              value: "false"
            - name: ENABLE_LOGIN_FORM
              value: "false"
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            - name: OAUTH_PROVIDER_NAME
              value: "Request Access"
            # Role mapping from Cognito groups
            - name: OAUTH_ROLES_CLAIM
              value: "cognito:groups"
            - name: OAUTH_ADMIN_ROLES
              value: "admin"
            - name: OAUTH_ALLOWED_ROLES
              value: "admin,user"
            # OAuth credentials from Kubernetes Secret (created by Terraform)
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: webui-oauth-cognito
                  key: OAUTH_CLIENT_ID
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: webui-oauth-cognito
                  key: OAUTH_CLIENT_SECRET
            - name: OPENID_PROVIDER_URL
              valueFrom:
                secretKeyRef:
                  name: webui-oauth-cognito
                  key: OPENID_PROVIDER_URL
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: webui-data
              mountPath: /app/backend/data
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
