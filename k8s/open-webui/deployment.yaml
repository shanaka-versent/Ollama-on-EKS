# Open WebUI — Browser-Based Chat Interface (Model Locked)
# @author Shanaka Jayasundera - shanakaj@gmail.com
#
# Provides a ChatGPT-like web interface for Ollama.
# Model switching is restricted to admin users only — regular users see
# only the default model. Admins can switch via the UI or CLI.
# Model name set per environment via Kustomize overlays in k8s/overlays/
# Runs on system nodes (no GPU needed). Connects to Ollama via ClusterIP.
#
# Access: via CloudFront URL (Cognito login with MFA)
# Auth: Cognito User Pool (OAuth/OIDC) — all user management in Cognito Console
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app: open-webui
    app.kubernetes.io/part-of: ollama-private-llm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      # Run on system nodes (no GPU needed)
      nodeSelector:
        kubernetes.io/arch: amd64
      # Security: hardened root — Open WebUI image requires UID 0 for
      # internal writes to /app/backend/ (outside PVC mount). Hardened
      # by dropping ALL capabilities and blocking privilege escalation.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.8.12
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              protocol: TCP
          # Tunable parameters from ConfigMap (edit without touching this file):
          #   kubectl edit configmap open-webui-config -n open-webui
          #   kubectl rollout restart deploy/open-webui -n open-webui
          envFrom:
            - configMapRef:
                name: open-webui-config
          env:
            # --- Fixed env vars (depend on secrets / variable substitution) ---
            - name: CLOUDFRONT_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: webui-oauth-cognito
                  key: CLOUDFRONT_DOMAIN
            - name: WEBUI_URL
              value: "https://$(CLOUDFRONT_DOMAIN)"
            - name: OPENID_REDIRECT_URI
              value: "https://$(CLOUDFRONT_DOMAIN)/oauth/oidc/callback"
            - name: OLLAMA_BASE_URL
              value: "http://ollama.ollama.svc.cluster.local:11434"
            - name: WEBUI_BANNERS
              valueFrom:
                secretKeyRef:
                  name: webui-oauth-cognito
                  key: WEBUI_BANNERS
            # --- OAuth credentials (Kubernetes Secret, created by Terraform) ---
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: webui-oauth-cognito
                  key: OAUTH_CLIENT_ID
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: webui-oauth-cognito
                  key: OAUTH_CLIENT_SECRET
            - name: OPENID_PROVIDER_URL
              valueFrom:
                secretKeyRef:
                  name: webui-oauth-cognito
                  key: OPENID_PROVIDER_URL
            - name: OAUTH_LOGOUT_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: webui-oauth-cognito
                  key: OAUTH_LOGOUT_URL
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: webui-data
              mountPath: /app/backend/data
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
