# Open WebUI — Browser-Based Chat Interface (Model Locked)
# @author Shanaka Jayasundera - shanakaj@gmail.com
#
# Provides a ChatGPT-like web interface for Ollama.
# Model switching is restricted to admin users only — regular users see
# only the default model (flagship). Admins can switch via the UI or CLI.
# Runs on system nodes (no GPU needed). Connects to Ollama via ClusterIP.
#
# Access: kubectl port-forward -n open-webui svc/open-webui 8080:80
# Then open: http://localhost:8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app: open-webui
    app.kubernetes.io/part-of: ollama-private-llm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      # Run on system nodes (no GPU needed)
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.6.5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            # Connect to Ollama via ClusterIP service
            - name: OLLAMA_BASE_URL
              value: "http://ollama.ollama.svc.cluster.local:11434"
            # Disable external connections (air-gap compliant)
            - name: ENABLE_RAG_WEB_SEARCH
              value: "false"
            - name: ENABLE_IMAGE_GENERATION
              value: "false"
            # Disable telemetry
            - name: SCARF_NO_ANALYTICS
              value: "true"
            - name: DO_NOT_TRACK
              value: "true"
            # Default model — locked for regular users
            - name: DEFAULT_MODELS
              value: "qwen3.5:122b-a10b"
            # Model filtering — only show the default model to users
            # Admins (first user + promoted users) can see all models
            - name: MODEL_FILTER_ENABLED
              value: "true"
            - name: MODEL_FILTER_LIST
              value: "qwen3.5:122b-a10b"
            # Disable signup after first user (security)
            - name: ENABLE_SIGNUP
              value: "true"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: webui-data
              mountPath: /app/backend/data
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
