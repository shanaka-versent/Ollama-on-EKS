# Open WebUI — Browser-Based Chat Interface (Model Locked)
# @author Shanaka Jayasundera - shanakaj@gmail.com
#
# Provides a ChatGPT-like web interface for Ollama.
# Model switching is restricted to admin users only — regular users see
# only the default model. Admins can switch via the UI or CLI.
# DEV: Tier 1 fallback (qwen3.5:27b, g5.xlarge) — PROD: switch to flagship
# Runs on system nodes (no GPU needed). Connects to Ollama via ClusterIP.
#
# Access: via CloudFront URL (Cognito login with MFA)
# Auth: Cognito User Pool (OAuth/OIDC) — all user management in Cognito Console
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app: open-webui
    app.kubernetes.io/part-of: ollama-private-llm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      # Run on system nodes (no GPU needed)
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.8.10
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            # External URL — required for OAuth redirect_uri to use CloudFront domain
            # Without this, Open WebUI uses the internal NLB hostname from the request
            - name: WEBUI_URL
              value: "https://d3f4nz5crzf5t8.cloudfront.net"
            # OAuth redirect URI — must match Cognito callback URL exactly
            # CloudFront connects to NLB via HTTP, so without this Open WebUI
            # generates http:// redirect_uri which Cognito rejects.
            - name: OPENID_REDIRECT_URI
              value: "https://d3f4nz5crzf5t8.cloudfront.net/oauth/oidc/callback"
            # Connect to Ollama via ClusterIP service
            - name: OLLAMA_BASE_URL
              value: "http://ollama.ollama.svc.cluster.local:11434"
            # Disable external connections (air-gap compliant)
            - name: ENABLE_RAG_WEB_SEARCH
              value: "false"
            - name: ENABLE_IMAGE_GENERATION
              value: "false"
            # Disable telemetry
            - name: SCARF_NO_ANALYTICS
              value: "true"
            - name: DO_NOT_TRACK
              value: "true"
            # Default model — locked for regular users
            # DEV: Tier 1 fallback (g5.xlarge, $0.35/hr spot)
            # PROD: Change to qwen3.5:122b-a10b (g5.12xlarge, $1.90/hr spot)
            - name: DEFAULT_MODELS
              value: "qwen3.5:27b"
            # Model filtering — only show the default model to users
            # Admins (first user + promoted users) can see all models
            - name: MODEL_FILTER_ENABLED
              value: "true"
            - name: MODEL_FILTER_LIST
              value: "qwen3.5:27b"
            # Banners (API key portal + password reset) — from K8s Secret
            # Terraform injects banner links to custom login portal
            - name: WEBUI_BANNERS
              valueFrom:
                secretKeyRef:
                  name: webui-oauth-cognito
                  key: WEBUI_BANNERS
            # --- Cognito OAuth/OIDC Authentication ---
            # Auto-activate OAuth users — Cognito group membership is the gate
            # (OAUTH_ALLOWED_ROLES rejects users not in admin/user group)
            - name: DEFAULT_USER_ROLE
              value: "user"
            # Disable local login/signup and password change — all auth via Cognito
            # Password changes handled via custom login portal (/auth/login.html)
            - name: ENABLE_SIGNUP
              value: "false"
            - name: ENABLE_LOGIN_FORM
              value: "false"
            - name: ENABLE_PASSWORD_AUTH
              value: "false"
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            - name: OAUTH_PROVIDER_NAME
              value: "Sign in to Open WebUI"
            # Role management from Cognito groups — synced on every login
            # Cognito is the source of truth for roles; any local changes are overwritten
            - name: ENABLE_OAUTH_ROLE_MANAGEMENT
              value: "true"
            - name: OAUTH_ROLES_CLAIM
              value: "cognito:groups"
            - name: OAUTH_ADMIN_ROLES
              value: "admin"
            - name: OAUTH_ALLOWED_ROLES
              value: "admin,user"
            # Admin panel — user management is read-only in effect (Cognito overrides)
            - name: ENABLE_ADMIN_CHAT_ACCESS
              value: "false"
            - name: ENABLE_ADMIN_EXPORT
              value: "false"
            # OAuth credentials from Kubernetes Secret (created by Terraform)
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: webui-oauth-cognito
                  key: OAUTH_CLIENT_ID
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: webui-oauth-cognito
                  key: OAUTH_CLIENT_SECRET
            - name: OPENID_PROVIDER_URL
              valueFrom:
                secretKeyRef:
                  name: webui-oauth-cognito
                  key: OPENID_PROVIDER_URL
            # Logout redirects to Cognito logout endpoint (clears Cognito session)
            - name: OAUTH_LOGOUT_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: webui-oauth-cognito
                  key: OAUTH_LOGOUT_URL
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: webui-data
              mountPath: /app/backend/data
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
