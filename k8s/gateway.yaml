# Ollama on EKS - Istio Gateway with Internal NLB
# @author Shanaka Jayasundera - shanakaj@gmail.com
#
# Creates the Istio ingress gateway with an INTERNAL NLB.
# API Gateway reaches this NLB via VPC Link.
#
# Traffic flow:
#   Client --> CloudFront (WAF) --> API Gateway --> VPC Link --> Internal NLB --> Istio Gateway --> Ollama
#
# IMPORTANT: This uses Gateway API (gateway.networking.k8s.io), NOT Ingress
#
# Node scheduling: All cluster nodes carry either CriticalAddonsOnly or nvidia.com/gpu taints.
# The Deployment below is a seed for Istio's auto-provisioning: Istio merges the real
# istio-proxy container into it. The inject.istio.io/templates=gateway annotation ensures
# the proxy runs in gateway mode (not sidecar mode). ArgoCD ignores the containers diff
# (see 10-gateway.yaml ignoreDifferences) so the toleration persists without sync loops.

---
# Deployment seed: provides CriticalAddonsOnly toleration so the gateway pod schedules
# on system nodes. Istio's controller merges the istio-proxy container into this Deployment.
# ArgoCD ignoreDifferences skips container drift — only tolerations are enforced from Git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-gateway-istio
  namespace: istio-ingress
  labels:
    gateway.networking.k8s.io/gateway-name: ollama-gateway
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: ollama-gateway
  template:
    metadata:
      labels:
        gateway.networking.k8s.io/gateway-name: ollama-gateway
      annotations:
        inject.istio.io/templates: gateway  # Use gateway mode, not sidecar mode
    spec:
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule
      containers:
        - name: istio-proxy
          image: auto  # Istio replaces this with the real istio-proxy image

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ollama-gateway
  namespace: istio-ingress
spec:
  gatewayClassName: istio

  # Infrastructure configuration for the auto-created LoadBalancer Service
  # Uses AWS Load Balancer Controller annotations for INTERNAL NLB
  infrastructure:
    labels:
      role: system
    annotations:
      # AWS Load Balancer Controller - INTERNAL NLB (not internet-facing)
      service.beta.kubernetes.io/aws-load-balancer-type: "external"
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
      # CRITICAL: Internal scheme — only reachable via VPC Link from API Gateway
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
      # Health check configuration
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: "TCP"
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "traffic-port"
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: "10"
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-unhealthy-threshold: "2"

  listeners:
    # HTTP Listener (port 80) — API Gateway VPC Link connects here
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All

    # HTTPS Listener (port 443) — optional end-to-end TLS
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: istio-gateway-tls
            namespace: istio-ingress
      allowedRoutes:
        namespaces:
          from: All
