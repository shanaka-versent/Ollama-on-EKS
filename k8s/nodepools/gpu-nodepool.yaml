# GPU NodePool for Ollama LLM Inference (EKS Auto Mode)
# @author Shanaka Jayasundera - shanakaj@gmail.com
#
# EKS Auto Mode NodePool for GPU workloads. Provisions g5 instances with spot
# preference and on-demand fallback. Karpenter always tries spot first (cheaper).
# If spot unavailable, falls back to on-demand. GPUOnDemandFallback alert fires
# via Prometheus → SNS → email so you know you're paying full price.
# Nodes terminate 10 minutes after becoming empty to save costs.
# KEDA scales Ollama to 0 after 15 min idle; Karpenter terminates the node 10 min later.
#
# IMPORTANT: EKS Auto Mode uses karpenter.sh/v1 API (NOT v1beta1) and
# eks.amazonaws.com NodeClass (NOT karpenter.k8s.aws EC2NodeClass).
#
# Environment-specific values (instance sizes, resource limits) are set via
# Kustomize overlays in k8s/overlays/dev/ and k8s/overlays/prod/.
#
# Instance types:
#   g5.xlarge   — 1x A10G (24GB) — Tier 1 (27b) / Tier 2 (coder:30b)
#   g5.2xlarge  — 1x A10G (24GB) — Same GPU, more CPU/RAM
#   g5.12xlarge — 4x A10G (96GB) — Tier 3 flagship (122b-a10b)
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-ollama
spec:
  template:
    metadata:
      labels:
        workload-type: gpu-inference
    spec:
      # Reference the EKS Auto Mode NodeClass (NOT EC2NodeClass)
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: gpu-ollama
      requirements:
        # GPU instance family
        - key: eks.amazonaws.com/instance-category
          operator: In
          values: ["g"]
        - key: eks.amazonaws.com/instance-family
          operator: In
          values: ["g5"]
        # Instance sizes — set per environment via Kustomize overlay
        - key: eks.amazonaws.com/instance-size
          operator: In
          values:
            - xlarge
            - 2xlarge
        # NVIDIA GPUs only
        - key: eks.amazonaws.com/instance-gpu-manufacturer
          operator: In
          values: ["nvidia"]
        # Spot preferred, on-demand fallback — Karpenter always tries spot first
        # because it's cheaper. Only falls back to on-demand when spot capacity is
        # genuinely unavailable. GPUOnDemandFallback Prometheus alert fires via
        # Alertmanager → SNS → email when on-demand is used.
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
            - on-demand
        # Sydney region AZs
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - ap-southeast-2a
            - ap-southeast-2b
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      # Taint to ensure only GPU workloads land here
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule
      # Auto-expire nodes after 14 days (forces refresh, picks up new AMIs)
      expireAfter: 336h
  # Resource limits — set per environment via Kustomize overlay
  limits:
    cpu: "8"
    memory: 32Gi
    nvidia.com/gpu: "1"
  # Disruption — terminate GPU node 10 min after Ollama pod is removed
  # KEDA handles the 15-min idle detection; Karpenter handles the node lifecycle
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
    budgets:
      - nodes: "100%"
