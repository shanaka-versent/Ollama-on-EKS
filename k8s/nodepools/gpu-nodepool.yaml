# GPU NodePool for Ollama LLM Inference
# @author Shanaka Jayasundera - shanakaj@gmail.com
#
# Karpenter NodePool for GPU workloads. Provisions g5 instances with spot
# preference and on-demand fallback. Nodes stay warm for 30 minutes after
# becoming empty, then terminate to save costs.
#
# Instance types:
#   g5.xlarge   — 1x A10G (24GB) — Tier 1 (27b) / Tier 2 (coder:30b)
#   g5.2xlarge  — 1x A10G (24GB) — Same GPU, more CPU/RAM
#   g5.12xlarge — 4x A10G (96GB) — Tier 3 flagship (122b-a10b)
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: gpu-ollama
spec:
  template:
    metadata:
      labels:
        workload-type: gpu-inference
    spec:
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - g5.xlarge
            - g5.2xlarge
            - g5.12xlarge
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
            - on-demand
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - ap-southeast-2a
            - ap-southeast-2b
      nodeClassRef:
        name: gpu-ollama
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule
  limits:
    cpu: "48"
    memory: 192Gi
    nvidia.com/gpu: "4"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30m
