# GPU NodePool for Ollama LLM Inference (EKS Auto Mode)
# @author Shanaka Jayasundera - shanakaj@gmail.com
#
# Flex Mode — NodePool ceiling allows both g5.xlarge (Tier 1/2) and
# g5.12xlarge (Tier 3 flagship). Karpenter provisions based on what
# the Ollama pod REQUESTS — not the ceiling. The ceiling is just a
# permission, not a provisioning order.
#
#   Pod requests 1 GPU  → g5.xlarge   ($0.35/hr spot)
#   Pod requests 4 GPUs → g5.12xlarge ($1.90/hr spot)
#   Pod scaled to 0     → no GPU node ($0/hr)
#
# switch-model.sh patches the deployment resources to switch tiers.
# Karpenter auto-provisions the right instance type.
#
# IMPORTANT: EKS Auto Mode uses karpenter.sh/v1 API (NOT v1beta1) and
# eks.amazonaws.com NodeClass (NOT karpenter.k8s.aws EC2NodeClass).
#
# Instance types:
#   g5.xlarge   — 1x A10G (24GB) — Tier 1 (27b) / Tier 2 (coder:30b)
#   g5.2xlarge  — 1x A10G (24GB) — Same GPU, more CPU/RAM
#   g5.12xlarge — 4x A10G (96GB) — Tier 3 flagship (122b-a10b)
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-ollama
spec:
  template:
    metadata:
      labels:
        workload-type: gpu-inference
    spec:
      # Reference the EKS Auto Mode NodeClass (NOT EC2NodeClass)
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: gpu-ollama
      requirements:
        # GPU instance family
        - key: eks.amazonaws.com/instance-category
          operator: In
          values: ["g"]
        - key: eks.amazonaws.com/instance-family
          operator: In
          values: ["g5"]
        # Flex: allow xlarge (Tier 1/2) and 12xlarge (Tier 3 flagship)
        # Karpenter picks the smallest instance that fits the pod's requests
        - key: eks.amazonaws.com/instance-size
          operator: In
          values:
            - xlarge
            - 2xlarge
            - 12xlarge
        # NVIDIA GPUs only
        - key: eks.amazonaws.com/instance-gpu-manufacturer
          operator: In
          values: ["nvidia"]
        # Spot preferred, on-demand fallback — Karpenter always tries spot first
        # because it's cheaper. Only falls back to on-demand when spot capacity is
        # genuinely unavailable. GPUOnDemandFallback Prometheus alert fires via
        # Alertmanager → SNS → email when on-demand is used.
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
            - on-demand
        # Single AZ — keeps all EBS PVCs co-located
        # For multi-AZ HA: uncomment ap-southeast-2b
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - ap-southeast-2a
            # - ap-southeast-2b    # Uncomment for multi-AZ HA
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      # Taint to ensure only GPU workloads land here
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule
      # Auto-expire nodes after 14 days (forces refresh, picks up new AMIs)
      expireAfter: 336h
  # Ceiling: must accommodate g5.12xlarge (48 vCPU, 192Gi, 4 GPU)
  # This is the MAXIMUM Karpenter can provision — not what's always running
  limits:
    cpu: "48"
    memory: 192Gi
    nvidia.com/gpu: "4"
  # Disruption — terminate GPU node 10 min after Ollama pod is removed
  # KEDA handles the 15-min idle detection; Karpenter handles the node lifecycle
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
    budgets:
      - nodes: "100%"
