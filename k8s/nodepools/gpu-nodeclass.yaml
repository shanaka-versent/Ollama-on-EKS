# NodeClass for GPU Ollama Nodes (EKS Auto Mode)
# @author Shanaka Jayasundera - shanakaj@gmail.com
#
# EKS Auto Mode NodeClass for GPU nodes. Configures networking, storage,
# and subnet/security group discovery.
#
# IMPORTANT: EKS Auto Mode uses eks.amazonaws.com/v1 NodeClass (NOT
# karpenter.k8s.aws EC2NodeClass). The NodeClass spec is different —
# no blockDeviceMappings or userData fields. EBS snapshot mounting for
# pre-loaded models is handled via the Ollama deployment's init container
# and PVC (see k8s/ollama/deployment.yaml and k8s/model-loader/).
#
# Model weights storage: The EBS snapshot with pre-loaded models is attached
# via a PersistentVolume backed by the snapshot, not via the NodeClass.
apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata:
  name: gpu-ollama
spec:
  # IAM role for GPU nodes (same role as system nodes, managed by EKS Auto Mode)
  role: role-eks-node-ollama-dev
  # Subnets — private subnets across 3 AZs for GPU spot availability
  subnetSelectorTerms:
    - id: subnet-0dd32354ab85b57cd  # ap-southeast-2a
    - id: subnet-066f317903382d947  # ap-southeast-2b
    - id: subnet-0187462fa039a14c6  # ap-southeast-2c
  # Security group — same as default NodeClass
  securityGroupSelectorTerms:
    - id: sg-0fb86f09fddc0fd08
  # Ephemeral storage for the node (root volume)
  ephemeralStorage:
    size: 80Gi
    iops: 6000
    throughput: 400
