# NodeClass for App Nodes (EKS Auto Mode)
# @author Shanaka Jayasundera - shanakaj@gmail.com
#
# EKS Auto Mode NodeClass for application workloads (Open WebUI).
# Moderate ephemeral storage for WebUI data, logs, temp files.
apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata:
  name: app
spec:
  # IAM role (same as system/GPU nodes, managed by EKS Auto Mode)
  role: role-eks-node-ollama-dev
  # Subnets — private subnets (same as system)
  subnetSelectorTerms:
    - id: subnet-0eec560521e6bb2b8
    - id: subnet-00720d00eb3546f68
    - id: subnet-0d89982ea1055d69f
  # Security group
  securityGroupSelectorTerms:
    - id: sg-0ab2140351647678c
  # Ephemeral storage — 40Gi for WebUI data, logs, temp files
  ephemeralStorage:
    size: 40Gi
