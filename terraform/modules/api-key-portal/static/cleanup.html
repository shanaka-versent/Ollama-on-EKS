<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f5f5f5; color: #555; }
    .spinner { width: 40px; height: 40px; border: 4px solid #ddd; border-top-color: #1e40af; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <span>Preparing session...</span>
  <script>
    (function() {
      try {
        // Clear all browser-side storage
        localStorage.clear();
        sessionStorage.clear();

        // Clear all cookies for this domain
        document.cookie.split(';').forEach(function(c) {
          var name = c.split('=')[0].trim();
          document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
          document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;domain=' + location.hostname;
        });

        // Clear caches if available
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
          });
        }
      } catch(e) {
        // Ignore errors — some browsers restrict storage access
      }

      // Redirect to login page
      window.location.replace('/auth/login.html');
    })();
  </script>
</body>
</html>
