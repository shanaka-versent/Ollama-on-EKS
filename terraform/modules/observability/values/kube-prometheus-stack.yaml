# ──────────────────────────────────────────────────────────────────────
# Disable built-in alerts incompatible with ephemeral GPU nodes
# ──────────────────────────────────────────────────────────────────────
# GPU nodes are intentionally ephemeral: KEDA scales Ollama to 0 after
# 15 min idle, Karpenter terminates the empty GPU node after 10 min.
# Built-in alerts that assume permanent nodes fire false positives
# every time the GPU node is terminated. Disable them here.
# System node health is still covered by our custom OllamaUnavailable,
# GPUPodPending, and KarpenterProvisioningFailed alerts.
defaultRules:
  disabled:
    KubeletDown: true              # Fires when GPU node kubelet disappears (expected)
    KubeNodeNotReady: true         # Fires briefly during GPU node termination
    KubeNodeUnreachable: true      # Fires after GPU node is terminated
    NodeFilesystemAlmostOutOfSpace: true  # Transient on short-lived GPU nodes

# ──────────────────────────────────────────────────────────────────────
# Prometheus
# ──────────────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    # CRITICAL: Must be false to pick up DCGM ServiceMonitor
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    retention: "${prometheus_retention}"

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: "${prometheus_storage_size}"

    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"

    # Scrape interval — 15m reduces AMP ingestion cost (~60x vs 15s)
    scrapeInterval: "15m"
    evaluationInterval: "15m"

    # Tolerate CriticalAddonsOnly taint on system nodes
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
        effect: NoSchedule

%{ if amp_remote_write_endpoint != "" }
    # Remote write to AMP — all metrics forwarded to AWS Managed Prometheus
    # AMG reads from AMP, so this bridges in-cluster metrics to the managed dashboard
    remoteWrite:
      - url: "${amp_remote_write_endpoint}"
        sigv4:
          region: ap-southeast-2
        queueConfig:
          maxSamplesPerSend: 1000
          maxShards: 200
          capacity: 2500
%{ endif }

%{ if amp_remote_write_role_arn != "" }
  # IRSA for Prometheus service account — allows remote write to AMP
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "${amp_remote_write_role_arn}"
%{ endif }

# ──────────────────────────────────────────────────────────────────────
# Grafana — DISABLED (using AWS Managed Grafana via IAM Identity Center)
# ──────────────────────────────────────────────────────────────────────
grafana:
  enabled: false

# ──────────────────────────────────────────────────────────────────────
# Alertmanager
# ──────────────────────────────────────────────────────────────────────
alertmanager:
%{ if sns_alert_topic_arn != "" }
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "${alertmanager_sns_role_arn}"
%{ endif }
  alertmanagerSpec:
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
        effect: NoSchedule
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "default"
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Spot/capacity alerts — immediate notification
        - match:
            alert_type: spot_unavailable
          receiver: "sns-critical"
          group_wait: 10s
          repeat_interval: 30m
        - match:
            alert_type: cost_warning
          receiver: "sns-warning"
          group_wait: 1m
          repeat_interval: 2h
        - match:
            alert_type: spot_interruption
          receiver: "sns-warning"
          group_wait: 10s
          repeat_interval: 15m
        # All critical alerts
        - match:
            severity: critical
          receiver: "sns-critical"
          group_wait: 10s
          repeat_interval: 1h
    receivers:
      - name: "default"
        # Default receiver — no action (alerts visible in Grafana/Alertmanager UI)
      - name: "sns-critical"
        sns_configs:
          - topic_arn: "${sns_alert_topic_arn}"
            subject: "[CRITICAL] Ollama EKS Alert"
            sigv4:
              region: "ap-southeast-2"
            attributes:
              severity: "critical"
      - name: "sns-warning"
        sns_configs:
          - topic_arn: "${sns_alert_topic_arn}"
            subject: "[WARNING] Ollama EKS Alert"
            sigv4:
              region: "ap-southeast-2"
            attributes:
              severity: "warning"

# ──────────────────────────────────────────────────────────────────────
# Additional PrometheusRules for Ollama/GPU alerts
# ──────────────────────────────────────────────────────────────────────
additionalPrometheusRulesMap:
  ollama-gpu-alerts:
    groups:
      - name: gpu.alerts
        rules:
          # GPU memory approaching limit — pre-OOM warning
          - alert: GPUMemoryHigh
            expr: (DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE)) * 100 > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "GPU memory usage above 85%"
              description: "GPU {{ $labels.gpu }} on {{ $labels.instance }} is at {{ $value }}% memory. Risk of OOM."

          - alert: GPUMemoryCritical
            expr: (DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE)) * 100 > 95
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "GPU memory usage above 95% — OOM imminent"
              description: "GPU {{ $labels.gpu }} on {{ $labels.instance }} is at {{ $value }}% memory."

          # GPU temperature warning
          - alert: GPUTemperatureHigh
            expr: DCGM_FI_DEV_GPU_TEMP > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "GPU temperature above 85°C"
              description: "GPU {{ $labels.gpu }} on {{ $labels.instance }} at {{ $value }}°C. Check cooling."

      - name: ollama.alerts
        rules:
          # Ollama pod restarting
          - alert: OllamaPodRestarts
            expr: increase(kube_pod_container_status_restarts_total{namespace="ollama", container="ollama"}[1h]) > 2
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Ollama pod restarting frequently"
              description: "Ollama pod has restarted {{ $value }} times in the last hour."

          # No Ollama pods running (could be expected if scaled to zero)
          - alert: OllamaUnavailable
            expr: kube_deployment_status_replicas_available{namespace="ollama", deployment="ollama"} == 0
            for: 10m
            labels:
              severity: info
            annotations:
              summary: "No Ollama pods running"
              description: "Ollama has been unavailable for 10+ minutes. May be scaled to zero (expected) or failing to start (check Karpenter)."

      - name: karpenter.alerts
        rules:
          # Karpenter unable to provision GPU node
          - alert: KarpenterProvisioningFailed
            expr: increase(karpenter_nodeclaims_terminated_total{reason="FailedProvisioning"}[15m]) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Karpenter failed to provision GPU node"
              description: "Karpenter could not provision a GPU node. Check capacity, quotas, and instance availability."

          # GPU pod stuck in Pending — no node available (spot unavailable in DEV)
          - alert: GPUPodPending
            expr: |
              kube_pod_status_phase{namespace="ollama", phase="Pending"} == 1
              and on(pod) kube_pod_container_resource_requests{resource="nvidia_com_gpu"} > 0
            for: 5m
            labels:
              severity: critical
              alert_type: spot_unavailable
            annotations:
              summary: "GPU pod stuck in Pending — spot instance likely unavailable"
              description: "Ollama GPU pod {{ $labels.pod }} has been Pending for 5+ minutes. Spot capacity may be unavailable. Check Karpenter logs and AWS Service Quotas."

          # On-demand fallback active — cost warning (PROD only)
          # Fires when a GPU node is running on-demand instead of spot
          - alert: GPUOnDemandFallback
            expr: |
              kube_node_labels{label_karpenter_sh_capacity_type="on-demand", label_workload_type="gpu-inference"} == 1
            for: 2m
            labels:
              severity: warning
              alert_type: cost_warning
            annotations:
              summary: "GPU node running on-demand — higher cost"
              description: "GPU node {{ $labels.node }} is using on-demand pricing instead of spot. Spot may be unavailable in this AZ. On-demand cost is ~5x spot. Monitor and consider scaling down if not needed."

          # Spot interruption — node being reclaimed
          - alert: GPUSpotInterruption
            expr: |
              increase(karpenter_nodeclaims_terminated_total{reason="SpotInterruption"}[10m]) > 0
            for: 0m
            labels:
              severity: warning
              alert_type: spot_interruption
            annotations:
              summary: "GPU spot instance reclaimed by AWS"
              description: "A GPU spot node was interrupted. Karpenter will attempt to provision a replacement. Expect ~2-3 min interruption."

# ──────────────────────────────────────────────────────────────────────
# Disable components we don't need
# ──────────────────────────────────────────────────────────────────────
# ──────────────────────────────────────────────────────────────────────
# Tolerations for operator and sub-charts
# ──────────────────────────────────────────────────────────────────────
prometheusOperator:
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
      effect: NoSchedule
  admissionWebhooks:
    patch:
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule

kube-state-metrics:
  # 10m interval for Karpenter Node Lifecycle / GPU Scaling dashboard visibility
  # while staying within AMP free tier (~170M / 200M samples/month)
  prometheus:
    monitor:
      interval: "10m"
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
      effect: NoSchedule

prometheus-node-exporter:
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
      effect: NoSchedule
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

# ──────────────────────────────────────────────────────────────────────
# Heavyweight ServiceMonitors — scrape every 1h to stay within AMP free tier
# These generate ~100K+ series but are rarely needed for dashboards/alerts
# ──────────────────────────────────────────────────────────────────────
kubeApiServer:
  serviceMonitor:
    interval: "1h"

kubelet:
  serviceMonitor:
    interval: "1h"

coreDns:
  serviceMonitor:
    interval: "1h"

kubeEtcd:
  enabled: false  # Not accessible on EKS managed control plane

kubeControllerManager:
  enabled: false  # Not accessible on EKS managed control plane

kubeScheduler:
  enabled: false  # Not accessible on EKS managed control plane

kubeProxy:
  enabled: false  # EKS Auto Mode doesn't run kube-proxy as a DaemonSet
