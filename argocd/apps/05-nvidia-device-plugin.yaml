# Wave 0: NVIDIA Device Plugin — REMOVED (EKS Auto Mode)
#
# EKS Auto Mode manages the NVIDIA device plugin automatically as part of
# its compute_config. Deploying a separate device plugin via ArgoCD creates
# a conflict — two device plugins competing for the same GPU resources.
#
# DO NOT re-add this. If you switch away from EKS Auto Mode to standalone
# Karpenter, you'll need to re-enable this by removing this comment block
# and restoring the Application manifest.
#
# Previous config (for reference):
#   Chart: nvidia-device-plugin 0.17.0 from https://nvidia.github.io/k8s-device-plugin
#   Namespace: kube-system
#   Tolerations: nvidia.com/gpu:NoSchedule, CriticalAddonsOnly:NoSchedule
#
# See: https://docs.aws.amazon.com/eks/latest/userguide/automode.html
