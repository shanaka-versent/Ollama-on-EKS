# Wave 1: App + GPU NodePools
# Built-in EKS Auto Mode "system" pool handles infra (c6g.large Graviton).
# Custom NodePools deployed here:
#   app: c6g.xlarge Graviton (user-facing: Open WebUI)
#   gpu-ollama: g5 spot (flex: 2xlarge + 12xlarge) for Ollama inference
# Must run early (wave 1) so nodes are available before workloads in wave 2+.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nodepools
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/shanaka-versent/Ollama-on-EKS
    targetRevision: HEAD
    path: k8s/nodepools
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
