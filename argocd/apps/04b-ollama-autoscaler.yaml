# Wave 4: Ollama Autoscaler (KEDA ScaledObject)
# Auto-scales Ollama to 0 replicas after 15 min of no inference requests.
# Karpenter then terminates the empty GPU node after 10 min.
# Requires: KEDA (wave 2), Ollama deployment (wave 3), Prometheus (Terraform).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama-autoscaler
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/shanaka-versent/Ollama-on-EKS
    targetRevision: HEAD
    path: k8s/keda
  destination:
    server: https://kubernetes.default.svc
    namespace: ollama
  # Ignore KEDA pause annotations — these are managed at runtime by the
  # GPU controller Lambda and scale-up.sh, not by Git. Without this,
  # ArgoCD selfHeal reverts the pause annotation and KEDA kills the GPU pod.
  ignoreDifferences:
    - group: keda.sh
      kind: ScaledObject
      jsonPointers:
        - /metadata/annotations/autoscaling.keda.sh~1paused
        - /metadata/annotations/gpu-controller~1paused-at
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
