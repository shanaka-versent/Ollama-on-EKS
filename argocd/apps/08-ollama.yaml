# Wave 3: Ollama Deployment
# Deploys the Ollama LLM server with GPU resources.
# DEV: 1x A10G (g5.xlarge) — PROD: 4x A10G (g5.12xlarge)
# Resources set via Kustomize overlays.
# Requires: namespaces (wave 1), storage (wave 2), NVIDIA plugin (wave 0)
#
# Environment switch: change path to k8s/overlays/prod/ollama for PROD
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/shanaka-versent/Ollama-on-EKS
    targetRevision: HEAD
    path: k8s/overlays/dev/ollama
  destination:
    server: https://kubernetes.default.svc
    namespace: ollama
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
