# Wave 3: Ollama Deployment
# Deploys the Ollama LLM server with GPU resources.
# Default: 1x A10G (Tier 1). switch-model.sh patches resources for other tiers.
# Requires: namespaces (wave 1), storage (wave 2), NVIDIA plugin (wave 0)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  # Ignore replicas — KEDA manages scaling (including scale-to-zero).
  # Ignore container resources — switch-model.sh patches GPU/memory/CPU
  # when switching tiers (e.g., 1 GPU for Tier 1, 4 GPUs for Tier 3).
  # Without this, ArgoCD selfHeal reverts the kubectl patch.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
        - /spec/template/spec/containers/0/resources
  source:
    repoURL: https://github.com/shanaka-versent/Ollama-on-EKS
    targetRevision: HEAD
    path: k8s/ollama
  destination:
    server: https://kubernetes.default.svc
    namespace: ollama
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
