# Wave 2: KEDA — Kubernetes Event-Driven Autoscaling
# Enables scale-to-zero for Ollama after 15 min of idle.
# KEDA monitors Prometheus metrics and auto-scales the Ollama deployment.
# Must deploy before ScaledObject (wave 4) and after monitoring (Terraform).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.16.1
    helm:
      releaseName: keda
      values: |
        nodeSelector:
          kubernetes.io/arch: amd64
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
