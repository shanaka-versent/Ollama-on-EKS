# Wave 4: Model Loader Job
# Runs a one-time Job that pulls the configured model into EBS storage.
# DEV: qwen3.5:27b (~18GB) — PROD: qwen3.5:122b-a10b (~81GB)
# Model set via Kustomize overlays.
# Requires: Ollama deployment running (wave 3)
#
# Environment switch: change path to k8s/overlays/prod/model-loader for PROD
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model-loader
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/shanaka-versent/Ollama-on-EKS
    targetRevision: HEAD
    path: k8s/overlays/dev/model-loader
  destination:
    server: https://kubernetes.default.svc
    namespace: ollama
  syncPolicy:
    automated:
      prune: true
      selfHeal: false   # Do not re-run the Job if it completed successfully
    syncOptions:
      - ApplyOutOfSyncOnly=true
