# Wave 7: Open WebUI — Browser-Based Chat Interface
# Deploys Open WebUI with Cognito auth, model locked for regular users.
# DEV: qwen3.5:27b — PROD: qwen3.5:122b-a10b
# Model set via Kustomize overlays.
# Requires: namespaces, Ollama (wave 3), Gateway (wave 5)
#
# Environment switch: change path to k8s/overlays/prod/open-webui for PROD
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: default
  source:
    repoURL: https://github.com/shanaka-versent/Ollama-on-EKS
    targetRevision: HEAD
    path: k8s/overlays/dev/open-webui
  destination:
    server: https://kubernetes.default.svc
    namespace: open-webui
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
