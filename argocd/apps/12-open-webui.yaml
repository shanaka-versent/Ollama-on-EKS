# Wave 7: Open WebUI — Browser-Based Chat Interface
# Deploys Open WebUI with Cognito auth, model locked for regular users.
# Default model: qwen3.5:27b (Tier 1). Admins can switch via UI or CLI.
# Requires: namespaces, Ollama (wave 3), Gateway (wave 5)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: default
  source:
    repoURL: https://github.com/shanaka-versent/Ollama-on-EKS
    targetRevision: HEAD
    path: k8s/open-webui
  destination:
    server: https://kubernetes.default.svc
    namespace: open-webui
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
